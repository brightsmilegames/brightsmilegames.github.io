<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hold the City – BrightSmile Games</title>
<meta name="description" content="Hold the City, a casual strategy game for Android by BrightSmile Games.">
<style>
  :root { --bg: #1d3b6e; --card: #ffffff; --text: #1f2633; --muted: #5b6475; --accent: #ffb52e; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
  .card { background: var(--card); border-radius: 20px; padding: 32px 24px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .logo { max-width: 260px; width: 100%; height: auto; margin-bottom: 8px; }
  h1 { margin: 8px 0 4px; font-size: 32px; }
  .studio { color: var(--muted); margin: 0 0 24px; }
  p { line-height: 1.6; }
  .links { margin-top: 28px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  a.button { display: inline-block; background: var(--accent); color: #3a2400; font-weight: 700; text-decoration: none; padding: 12px 22px; border-radius: 999px; }
  a { color: #1d5fd1; }
  footer { text-align: center; color: #c9d6ee; font-size: 14px; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <div class="card">
    <img class="logo" src="logo.png" alt="Hold the City" onerror="this.style.display='none'">
    <h1>Hold the City</h1>
    <p class="studio">by BrightSmile Games</p>
    <p>Rioting crowds are gathering all over the city. Send your guards at the right moment, use your boosters wisely and protect the city across 100 levels!</p>
    <div class="links">
      <!-- Replace # with the Play Store link once the game is published -->
      <a class="button" href="#">Coming soon on Google Play</a>
      <a href="privacy.html">Privacy Policy</a>
      <a href="mailto:brightsmile.games@gmail.com">Contact: brightsmile.games@gmail.com</a>
    </div>
  </div>
  <footer>© 2026 BrightSmile Games</footer>
</main>
</body>
</html>
